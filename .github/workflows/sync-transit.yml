# 매월 버스 정류장·막차 정보 자동 갱신 (db/sync-transit.mjs)
#
# 필요 시크릿: DATABASE_URL, KTO_API_KEY
#   → 레포 Settings > Secrets and variables > Actions 에 등록
#   시크릿이 없으면 동기화를 건너뛰고 경고만 남긴다 (다른 워크플로와 동일한 방침)
#
# npm run db:transit이 아니라 node를 직접 부르는 이유: 그 스크립트는 로컬용으로
# --env-file=.env.local을 쓰는데 CI에는 그 파일이 없다. 여기서는 시크릿을 env로 준다.
name: Sync transit

on:
  schedule:
    # 매월 1일 18:00 UTC = 매월 2일 03:00 KST (Actions cron은 UTC 기준)
    - cron: "0 18 1 * *"
  workflow_dispatch: # 필요할 때 수동 실행

# 수동 실행이 겹쳐도 동시에 돌지 않게 (같은 행을 upsert하므로)
concurrency:
  group: sync-transit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 행 방지 — Actions 무료 시간 보호
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: 정류장·막차 동기화
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KTO_API_KEY: ${{ secrets.KTO_API_KEY }}
        run: |
          set -o pipefail
          if [ -z "$DATABASE_URL" ] || [ -z "$KTO_API_KEY" ]; then
            echo "::warning::DATABASE_URL/KTO_API_KEY 시크릿이 없어 동기화를 건너뜁니다 (수동: npm run db:transit)"
            exit 0
          fi
          node db/sync-transit.mjs | tee sync.log
          # 실행 요약(마지막 집계 줄)을 Actions 요약 화면에 남긴다
          {
            echo "### 정류장·막차 동기화"
            echo '```'
            tail -n 2 sync.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
